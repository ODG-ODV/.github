
name: Reusable - Publish GitHub Release

on:
  workflow_call:
    inputs:
      version:
        description: "Semantic version (e.g. v1.0.0)"
        required: true
        type: string

      commit_sha:
        description: "Full SHA of the verified production commit"
        required: true
        type: string

      release_notes:
        description: "Optional manual release notes"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Validate release inputs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          if [[ ! "$COMMIT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Expected a full 40-character commit SHA."
            exit 1
          fi

          MAIN_SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/branches/main" \
            --jq '.commit.sha')

          if [[ "${COMMIT_SHA,,}" != "${MAIN_SHA,,}" ]]; then
            echo "::error::Commit does not match main HEAD."
            exit 1
          fi

          if gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" \
            --silent 2>/dev/null; then
            echo "::error::Tag ${VERSION} already exists."
            exit 1
          fi

          if gh release view "$VERSION" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release ${VERSION} already exists."
            exit 1
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          args=(
            "$VERSION"
            --repo "$GITHUB_REPOSITORY"
            --target "$COMMIT_SHA"
            --title "$VERSION"
          )

          if [[ -n "$RELEASE_NOTES" ]]; then
            args+=(--notes "$RELEASE_NOTES")
          else
            args+=(--generate-notes)
          fi

          gh release create "${args[@]}"
