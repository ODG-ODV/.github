
# GitHub automatically generated release notes
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - documentation
      - chore
    authors:
      - dependabot

  categories:
    - title: Breaking Changes
      labels:
        - breaking-change

    - title: Security
      labels:
        - security

    - title: Features
      labels:
        - feature

    - title: Bug Fixes
      labels:
        - bug

    - title: Improvements
      labels:
        - enhancement

    - title: Performance
      labels:
        - performance

    - title: Other Changes
      labels:
        - "*"
